<div class="create m3" *ngIf="datas$ | async as datas">
  <mat-card>

    <mat-card-title>
      <div fxLayout="row" fxLayoutAlign="start center">
        <button mat-icon-button (click)="back()">
          <mat-icon>arrow_back</mat-icon>
        </button>

        <h1 *ngIf="!datas.onUpdate">Create session</h1>
        <h1 *ngIf="datas.onUpdate">Update session</h1>
      </div>
    </mat-card-title>

    <mat-card-content>
      <form [formGroup]="datas.form" (ngSubmit)="submit(datas)">

        <mat-form-field>
          <input matInput formControlName="name">
        </mat-form-field>

        <mat-form-field>
          <input matInput type="date" formControlName="date">
        </mat-form-field>

        <mat-form-field>
          <mat-select formControlName="teacher_id">
            <mat-option *ngFor="let teacher of teachers$ | async" [value]="teacher.id">
              {{teacher.firstName}} {{teacher.lastName}}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field>
          <textarea matInput formControlName="description"></textarea>
        </mat-form-field>

        <button type="submit" [disabled]="datas.form.invalid">
          Save
        </button>

      </form>
    </mat-card-content>

  </mat-card>
</div>
